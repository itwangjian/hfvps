<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航 · Bookmarks</title>
<style>
  :root {
    --bg-0: #0a0e1a;
    --bg-1: #111827;
    --bg-2: #1a2235;
    --border: rgba(148, 163, 184, 0.12);
    --border-hover: rgba(99, 179, 237, 0.5);
    --text-1: #e2e8f0;
    --text-2: #94a3b8;
    --text-3: #64748b;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --danger: #f87171;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg-0);
    color: var(--text-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(129, 140, 248, 0.08) 0%, transparent 50%),
      var(--bg-0);
  }

  .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; margin-bottom: 28px;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: 0.5px;
  }

  .brand-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
  }

  .toolbar {
    display: flex; gap: 10px; align-items: center; flex: 1;
    justify-content: flex-end; min-width: 280px;
  }

  .search-box {
    position: relative; flex: 1; max-width: 420px;
  }

  .search-box input {
    width: 100%; padding: 11px 14px 11px 40px;
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-1); font-size: 14px;
    transition: all 0.2s;
  }

  .search-box input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
  }

  .search-box::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px; opacity: 0.6;
  }

  .btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg-1); color: var(--text-1); cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all 0.2s;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; color: #fff;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
  }

  .btn-ghost { background: transparent; }

  .btn-icon { padding: 10px 12px; }

  .stats {
    color: var(--text-3); font-size: 13px; margin-bottom: 20px;
  }

  .category {
    margin-bottom: 36px; animation: fadeIn 0.4s ease;
  }

  .category-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .category-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; color: var(--text-1);
  }

  .category-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px var(--accent);
  }

  .category-count { color: var(--text-3); font-size: 13px; font-weight: 400; }

  .category-actions { display: flex; gap: 6px; }

  .icon-btn {
    background: transparent; border: none; color: var(--text-3);
    cursor: pointer; padding: 4px 8px; border-radius: 6px;
    font-size: 13px; transition: all 0.15s;
  }

  .icon-btn:hover { color: var(--accent); background: var(--bg-2); }

  .icon-btn.danger:hover { color: var(--danger); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; background: var(--bg-1); border: 1px solid var(--border);
    border-radius: 12px; text-decoration: none; color: var(--text-1);
    transition: all 0.2s; position: relative; overflow: hidden;
  }

  .card::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.06), transparent);
    opacity: 0; transition: opacity 0.2s;
  }

  .card:hover {
    border-color: var(--border-hover); transform: translateY(-2px);
    box-shadow: var(--shadow);
  }

  .card:hover::before { opacity: 1; }

  .card-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-2); display: grid; place-items: center;
    flex-shrink: 0; overflow: hidden;
  }

  .card-icon img { width: 24px; height: 24px; }

  .card-icon-fallback {
    width: 100%; height: 100%; display: grid; place-items: center;
    color: var(--accent); font-weight: 600; font-size: 14px;
  }

  .card-body { flex: 1; min-width: 0; }

  .card-name {
    font-size: 14px; font-weight: 500; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .card-desc {
    font-size: 12px; color: var(--text-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .card-actions {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 4px; opacity: 0;
    transition: opacity 0.15s; z-index: 2;
  }

  .card:hover .card-actions { opacity: 1; }

  .card-action {
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text-2); cursor: pointer; font-size: 11px;
    display: grid; place-items: center; transition: all 0.15s;
  }

  .card-action:hover { color: var(--accent); }

  .card-action.danger:hover { color: var(--danger); border-color: var(--danger); }

  .empty {
    text-align: center; padding: 80px 20px; color: var(--text-3);
  }

  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

  /* Modal */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px); display: none;
    align-items: center; justify-content: center; z-index: 100;
    animation: fadeIn 0.2s ease;
  }

  .modal-mask.active { display: flex; }

  .modal {
    background: var(--bg-1); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; width: 90%; max-width: 460px;
    box-shadow: var(--shadow);
    animation: slideUp 0.25s ease;
  }

  .modal h3 { margin-bottom: 18px; font-size: 18px; }

  .field { margin-bottom: 14px; }

  .field label {
    display: block; margin-bottom: 6px; font-size: 13px;
    color: var(--text-2);
  }

  .field input, .field select {
    width: 100%; padding: 10px 12px; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-1); font-size: 14px;
    font-family: inherit;
  }

  .field input:focus, .field select:focus {
    outline: none; border-color: var(--accent);
  }

  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    .container { padding: 20px 14px; }
    .toolbar { width: 100%; }
    .search-box { max-width: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <span>我的导航</span>
    </div>
    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="search" placeholder="搜索名称、描述、标签…" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="btn-add">+ 添加</button>
      <button class="btn btn-ghost btn-icon" id="btn-export" title="导出 JSON">⬇</button>
      <button class="btn btn-ghost btn-icon" id="btn-import" title="导入 JSON">⬆</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="content"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <h3 id="modal-title">添加书签</h3>
    <div class="field">
      <label>名称 *</label>
      <input type="text" id="f-name" placeholder="GitHub">
    </div>
    <div class="field">
      <label>URL *</label>
      <input type="text" id="f-url" placeholder="https://github.com">
    </div>
    <div class="field">
      <label>描述</label>
      <input type="text" id="f-desc" placeholder="代码托管平台">
    </div>
    <div class="field">
      <label>分类</label>
      <input type="text" id="f-cat" list="cat-list" placeholder="开发工具">
      <datalist id="cat-list"></datalist>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-save">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'bookmarks_v1';
  const DEFAULT_DATA = [
    { id: 'd1', name: 'Google',     url: 'https://www.google.com',     desc: '搜索引擎',         category: '常用' },
    { id: 'd2', name: 'GitHub',     url: 'https://github.com',         desc: '代码托管',         category: '开发工具' },
    { id: 'd3', name: 'MDN Web Docs', url: 'https://developer.mozilla.org', desc: 'Web 技术文档', category: '开发工具' },
    { id: 'd4', name: 'SAP Help Portal', url: 'https://help.sap.com',  desc: 'SAP 官方文档',     category: 'SAP' },
    { id: 'd5', name: 'ABAP Cheat Sheets', url: 'https://github.com/SAP-samples/abap-cheat-sheets', desc: 'ABAP 现代语法速查', category: 'SAP' },
    { id: 'd6', name: 'Claude',     url: 'https://claude.ai',          desc: 'Anthropic AI',     category: 'AI' },
    { id: 'd7', name: 'ChatGPT',    url: 'https://chat.openai.com',    desc: 'OpenAI',           category: 'AI' },
  ];

  let data = load();
  let editingId = null;

  const $ = (s) => document.querySelector(s);
  const content = $('#content');
  const searchInput = $('#search');
  const stats = $('#stats');
  const modalMask = $('#modal-mask');
  const catList = $('#cat-list');

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [...DEFAULT_DATA];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [...DEFAULT_DATA];
    } catch {
      return [...DEFAULT_DATA];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function uid() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function getDomain(url) {
    try { return new URL(url).hostname; } catch { return ''; }
  }

  function faviconURL(url) {
    const d = getDomain(url);
    return d ? `https://www.google.com/s2/favicons?domain=${d}&sz=64` : '';
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function groupByCategory(list) {
    const map = new Map();
    for (const item of list) {
      const k = item.category || '未分类';
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(item);
    }
    return map;
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q
      ? data.filter((b) =>
          [b.name, b.desc, b.category, b.url].some((f) => (f || '').toLowerCase().includes(q))
        )
      : data;

    stats.textContent = q
      ? `找到 ${filtered.length} 个结果（共 ${data.length} 个书签）`
      : `共 ${data.length} 个书签 · ${groupByCategory(data).size} 个分类`;

    if (filtered.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🔍</div>
          <div>${q ? '没有匹配的书签' : '还没有书签，点击右上角「+ 添加」开始吧'}</div>
        </div>`;
      updateCatList();
      return;
    }

    const groups = groupByCategory(filtered);
    const categories = [...groups.keys()].sort((a, b) => a.localeCompare(b, 'zh-CN'));

    content.innerHTML = categories.map((cat) => {
      const items = groups.get(cat);
      return `
        <section class="category">
          <div class="category-header">
            <div class="category-title">
              <span class="dot"></span>
              <span>${escapeHtml(cat)}</span>
              <span class="category-count">· ${items.length}</span>
            </div>
          </div>
          <div class="grid">
            ${items.map(renderCard).join('')}
          </div>
        </section>`;
    }).join('');

    bindCardEvents();
    updateCatList();
  }

  function renderCard(b) {
    const fav = faviconURL(b.url);
    const initial = (b.name || '?').slice(0, 1).toUpperCase();
    return `
      <a class="card" href="${escapeHtml(b.url)}" target="_blank" rel="noopener" data-id="${b.id}">
        <div class="card-icon">
          ${fav
            ? `<img src="${fav}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-icon-fallback',textContent:'${initial}'}))">`
            : `<div class="card-icon-fallback">${initial}</div>`}
        </div>
        <div class="card-body">
          <div class="card-name">${escapeHtml(b.name)}</div>
          <div class="card-desc">${escapeHtml(b.desc || getDomain(b.url))}</div>
        </div>
        <div class="card-actions">
          <button class="card-action" data-act="edit" title="编辑">✎</button>
          <button class="card-action danger" data-act="del" title="删除">✕</button>
        </div>
      </a>`;
  }

  function bindCardEvents() {
    content.querySelectorAll('.card-action').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const card = btn.closest('.card');
        const id = card.dataset.id;
        const act = btn.dataset.act;
        if (act === 'del') deleteItem(id);
        else if (act === 'edit') openModal(id);
      });
    });
  }

  function updateCatList() {
    const cats = [...new Set(data.map((b) => b.category).filter(Boolean))];
    catList.innerHTML = cats.map((c) => `<option value="${escapeHtml(c)}">`).join('');
  }

  function openModal(id) {
    editingId = id || null;
    $('#modal-title').textContent = id ? '编辑书签' : '添加书签';
    if (id) {
      const b = data.find((x) => x.id === id);
      if (!b) return;
      $('#f-name').value = b.name;
      $('#f-url').value = b.url;
      $('#f-desc').value = b.desc || '';
      $('#f-cat').value = b.category || '';
    } else {
      ['#f-name', '#f-url', '#f-desc', '#f-cat'].forEach((s) => ($(s).value = ''));
    }
    modalMask.classList.add('active');
    setTimeout(() => $('#f-name').focus(), 50);
  }

  function closeModal() {
    modalMask.classList.remove('active');
    editingId = null;
  }

  function saveItem() {
    const name = $('#f-name').value.trim();
    let url = $('#f-url').value.trim();
    const desc = $('#f-desc').value.trim();
    const category = $('#f-cat').value.trim() || '未分类';

    if (!name || !url) {
      alert('名称和 URL 必填');
      return;
    }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

    if (editingId) {
      const idx = data.findIndex((x) => x.id === editingId);
      if (idx >= 0) data[idx] = { ...data[idx], name, url, desc, category };
    } else {
      data.push({ id: uid(), name, url, desc, category });
    }
    save();
    closeModal();
    render();
  }

  function deleteItem(id) {
    const b = data.find((x) => x.id === id);
    if (!b) return;
    if (!confirm(`确定删除「${b.name}」？`)) return;
    data = data.filter((x) => x.id !== id);
    save();
    render();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bookmarks-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const arr = JSON.parse(e.target.result);
        if (!Array.isArray(arr)) throw new Error('格式错误');
        const valid = arr.filter((x) => x && x.name && x.url).map((x) => ({
          id: x.id || uid(),
          name: String(x.name),
          url: String(x.url),
          desc: x.desc ? String(x.desc) : '',
          category: x.category ? String(x.category) : '未分类',
        }));
        if (!confirm(`导入 ${valid.length} 个书签？将合并到现有数据。`)) return;
        const existingIds = new Set(data.map((x) => x.id));
        valid.forEach((v) => { if (existingIds.has(v.id)) v.id = uid(); });
        data = data.concat(valid);
        save();
        render();
      } catch (err) {
        alert('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // Events
  searchInput.addEventListener('input', render);
  $('#btn-add').addEventListener('click', () => openModal());
  $('#btn-cancel').addEventListener('click', closeModal);
  $('#btn-save').addEventListener('click', saveItem);
  modalMask.addEventListener('click', (e) => { if (e.target === modalMask) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalMask.classList.contains('active')) closeModal();
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });
  $('#btn-export').addEventListener('click', exportData);
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', (e) => {
    if (e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });

  render();
})();
</script>
</body>
</html>
